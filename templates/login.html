{% extends "base.html" %}
{% block title %}Sign in · HireRank AI{% endblock %}
{% block auth_content %}
<section class="auth-card">
  <div class="auth-eyebrow"><span class="status-dot"></span> RECRUITMENT WORKSPACE</div>
  <h1>Welcome back</h1>
  <p class="muted">Sign in to continue to your hiring dashboard.</p>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email address<input type="email" name="email" autocomplete="email" placeholder="you@gmail.com" pattern=".+@[Gg][Mm][Aa][Ii][Ll]\.[Cc][Oo][Mm]" title="Please use a Gmail address ending with @gmail.com." required></label>
    <p class="muted">Please use a Gmail address ending with @gmail.com.</p>
    <label>Password<input type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required></label>
    <button class="button button-primary button-wide" type="submit">Sign in <i class="fa-solid fa-arrow-right"></i></button>
  </form>
  <p class="auth-switch">New to HireRank? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
